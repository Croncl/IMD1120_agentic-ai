[project]
name = "mcp-agent"
version = "0.1.0"
description = "Agente com conectores MCP e interface em Streamlit."
requires-python = ">=3.10"
dependencies = [
    "langchain[mcp,openai]>=1.4",
    "langgraph>=1.0",
    "mcp>=2,<3",
    "python-dotenv>=1.0",
    "streamlit>=1.46",
    "uv>=0.5",
]

[project.optional-dependencies]
# servidor da disciplina, em servers/course.py
course = ["langchain-chroma>=1.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
